# Forensic Analysis Lab (containers run tools against read-only evidence)
services:
  # One-stop CLI toolbox (Sleuth Kit, TestDisk/PhotoRec, Foremost, ewf-tools, exiftool, hashdeep, bulk_extractor, YARA, Volatility3)
  # Usage:
  #   Interactive mode (recommended): docker compose run --rm -it dfir
  #   One-off command: docker compose run --rm dfir fls -r /evidence/usb.img
  #   Background mode: docker compose up -d dfir && docker compose exec dfir bash
  dfir:
    build:
      context: .
      dockerfile: images/dfir-cli/Dockerfile
    image: ${DFIR_IMAGE:-ghcr.io/michael-borck/dfir-cli:latest}  # prebuilt on GHCR; falls back to `build` below
    user: root                      # FUSE requires root for fusermount
    read_only: false                # FUSE needs write access to /dev, /sys, /run
    working_dir: /cases
    volumes:
      - ./evidence:/evidence:ro    # <-- mount evidence READ-ONLY
      - ./cases:/cases             # outputs & working files
      - ./rules:/rules:ro          # optional YARA rules, etc.
    tmpfs:
      - /tmp
      - /run
      - /usr/local/lib/python3.13/dist-packages/volatility3/symbols
    stdin_open: true                # Keep STDIN open for interactive sessions
    tty: true                       # Allocate pseudo-TTY for interactive sessions
    devices:                        # Enable FUSE for ewfmount and xmount
      - /dev/fuse
    cap_add:                        # Add capabilities for FUSE
      - SYS_ADMIN
      - DAC_OVERRIDE
    security_opt:
      - apparmor=unconfined        # Required for FUSE on some systems
    # Note: No 'command' specified - uses Dockerfile CMD (/bin/bash) by default

  # Plaso (log2timeline) for super timelines
  plaso:
    # Pinned: plaso publishes dated tags, and a timeline tool changing under a
    # case guide is worse than a stale one.
    image: log2timeline/plaso:20260720
    platform: linux/amd64  # published amd64-only; runs emulated on Apple Silicon (fine — batch CLI)
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    working_dir: /cases
    volumes:
      - ./evidence:/evidence:ro
      - ./cases:/cases
    tmpfs:
      - /tmp
    command: ["sleep", "infinity"]

  # Optional GUI: Autopsy over noVNC in your browser at http://localhost:8080/vnc.html
  # Note: community images vary; if it doesn't start on your OS, keep using CLI tools above.
  autopsy:
    # Pinned by digest: this image only ever publishes :latest (last rebuilt
    # 2024-01), so a digest is the only way to pin it.
    image: eecs388/autopsy@sha256:6afc77df01bb2c05e5e193d3a9f74be67d0d2bd5c88a3ae8ecc81dfb6e45abfa  # Third-party public image (UMich EECS388); used as the maintained multi-arch Autopsy build
    depends_on:
      - novnc
    environment:
      - DISPLAY=novnc:0.0
    networks: [x11]
    volumes:
      - ./cases:/cases
      - ./evidence:/evidence:ro
    # Note: No change needed for _JAVA_OPTIONS, but be aware if performance issues arise

  novnc:
    # Pinned by digest: :latest is the only tag published.
    image: theasp/novnc@sha256:6e4f7346150b07983c4bc0d445a6fb227302aed8d00fbfd9cfdf81b07f68851d
    platform: linux/amd64  # published amd64-only; runs emulated on Apple Silicon (fine — lightweight proxy)
    ports:
      - "${LAB_BIND:-127.0.0.1}:8080:8080"
    environment:
      - DISPLAY_WIDTH=${DISPLAY_WIDTH}
      - DISPLAY_HEIGHT=${DISPLAY_HEIGHT}
      - RUN_XTERM=no
    networks: [x11]

networks:
  x11: {}
